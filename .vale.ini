# The zeabur-writing style on this repository; the same as skills/zeabur-writing/vale/vale.ini
# apart from StylesPath (scripts/ci/prose.sh checks it).
StylesPath = skills/zeabur-writing/vale
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = ZeaburEn

[*zh-TW*.{md,mdx}]
BasedOnStyles = ZeaburZh, ZeaburZhTW
ZeaburZh.SpaceExtraString = NO

[*zh-CN*.{md,mdx}]
BasedOnStyles = ZeaburZh, ZeaburZhCN
ZeaburZh.SpaceExtraString = NO

# TypeScript message catalogues: only their strings are text.
[*i18n*/en.ts]
BasedOnStyles = ZeaburEn
View = ZeaburI18n

[*i18n*/zh-TW.ts]
BasedOnStyles = ZeaburZh, ZeaburZhTW
View = ZeaburI18n
ZeaburZh.SpaceCode = NO
ZeaburZh.SpaceExtra = NO
ZeaburZhTW.ScriptAttr = NO

[*i18n*/zh-CN.ts]
BasedOnStyles = ZeaburZh, ZeaburZhCN
View = ZeaburI18n
ZeaburZh.SpaceCode = NO
ZeaburZh.SpaceExtra = NO
ZeaburZhCN.ScriptAttr = NO
