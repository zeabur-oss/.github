name: CI setup
description: >-
  Installs Nix with its store cached in the GitHub cache and, with rust-cache, installs kache with
  its cache for Cargo's build output.
inputs:
  rust-cache:
    description: >-
      "true" to install kache and its cache, one for the repository. The job runs Cargo as
      `kache cargo -- <command>`. Runs of main save the cache, on a push or the schedule; every
      other ref only restores it, since a cache saved on a pull request or merge queue ref can't be
      read from any other ref.
    default: "false"
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
    - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      with:
        version: v3.1.0
        upstream-cache-filter: true
    - if: inputs.rust-cache == 'true'
      uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
      with:
        save-cache: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        pr-comment: false
