# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Releases").
[package]
versioned_files = ["package.json"]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

# knope writes CHANGELOG.md without a blank line before the new heading, and package.json without
# its final newline.
[[workflows.steps]]
type = "Command"
command = "bun fmt CHANGELOG.md package.json"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
