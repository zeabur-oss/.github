name: CI

# Runs the jobs of a repository's scripts/ci/jobs, each as `scripts/ci.sh <job>`, plus zizmor. A
# pull request and a push run the `fast` tier; the merge queue, a schedule and a manual run take
# every job. Each job's runner, fetch depth and Rust cache come from its row.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  list:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # --matrix runs without the dev shell.
      - id: list
        env:
          TIER: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'fast' || 'all' }}
        run: |
          matrix=$(./scripts/ci.sh --matrix "$TIER")
          [[ "$matrix" != "[]" ]] || { echo "::error::scripts/ci.sh --matrix $TIER printed no jobs"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  zizmor:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      - run: nix run nixpkgs#zizmor -- --offline --no-progress --min-severity medium .github

  job:
    name: ${{ matrix.job }}
    needs: list
    runs-on: ${{ matrix.runner || 'ubuntu-26.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.fetch-depth || 1 }}
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      # rust-cache keys on `rustc -vV`, so use the dev shell's toolchain.
      - if: matrix.rust-cache == 'true'
        run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH"
      - if: matrix.rust-cache == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.job }}
      - env:
          JOB: ${{ matrix.job }}
          # Uploaded after the job, pass or fail.
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
        run: ./scripts/ci.sh "$JOB"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.job }}
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The check rulesets require.
  ok:
    if: always()
    needs: [list, zizmor, job]
    runs-on: ubuntu-slim
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::a job ended with $result"; exit 1; }
          done
