name: CI

# Runs each job of `scripts/ci.sh --list` as `scripts/ci.sh <job>`, plus zizmor.
on:
  workflow_call:
    inputs:
      runner:
        description: The runner of every job.
        type: string
        default: ubuntu-26.04-arm
      fetch-depth:
        description: Commits to fetch; 0 fetches all of them.
        type: number
        default: 1
      rust-cache:
        description: Restore and save target/ and the Cargo registry, one cache per job.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  list:
    runs-on: ubuntu-slim
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # --list runs without the dev shell.
      - id: list
        run: |
          jobs=$(./scripts/ci.sh --list | awk 'NF { printf "%s\"%s\"", (n++ ? "," : ""), $1 }')
          [[ -n "$jobs" ]] || { echo "::error::scripts/ci.sh --list printed no jobs"; exit 1; }
          echo "jobs=[$jobs]" >> "$GITHUB_OUTPUT"

  zizmor:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - run: nix run nixpkgs#zizmor -- --offline --no-progress --min-severity medium .github

  job:
    name: ${{ matrix.job }}
    needs: list
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.list.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      # rust-cache keys on `rustc -vV`, so use the dev shell's toolchain.
      - if: inputs.rust-cache
        run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH"
      - if: inputs.rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.job }}
      - env:
          JOB: ${{ matrix.job }}
          # Uploaded after the job, pass or fail.
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
        run: ./scripts/ci.sh "$JOB"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.job }}
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The check rulesets require.
  ok:
    if: always()
    needs: [list, zizmor, job]
    runs-on: ubuntu-slim
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::a job ended with $result"; exit 1; }
          done
