name: zizmor

# zizmor on the caller's .github.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ${{ vars.CI_RUNNER_LINT || 'ubuntu-26.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix run nixpkgs#zizmor -- --offline --no-progress --min-severity medium .github
