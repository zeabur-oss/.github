name: Skills

# Copies the skills of skills-lock.json that come from zeabur-oss/skills again into .claude/skills
# and opens one pull request with what changed. zeabur-oss-bot opens it, because a pull request
# made with GITHUB_TOKEN does not start CI.
on:
  workflow_call:
    secrets:
      private-key:
        description: The private key of zeabur-oss-bot (ZEABUR_OSS_BOT_PRIVATE_KEY).
        required: true

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      # --json fails on a skill gone upstream even when the others are found.
      - env:
          DISABLE_TELEMETRY: '1'
        run: |
          mapfile -t skills < <(jq -r '.skills | to_entries[]
            | select(.value.source == "zeabur-oss/skills") | .key' skills-lock.json)
          nix shell nixpkgs#nodejs --command npx --yes skills@1.7.4 add zeabur-oss/skills \
            --skill "${skills[@]}" --agent claude-code --copy --yes --json
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # The commit's author must match its sign-off (the DCO check).
      - id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "identity=${APP_SLUG}[bot] <${id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          signoff: true
          sign-commits: true
          add-paths: |
            .claude/skills
            skills-lock.json
          branch: update/skills
          delete-branch: true
          commit-message: "chore(skills): update the shared skills"
          title: "chore(skills): update the shared skills"
          body: Copied again from zeabur-oss/skills by `.github/workflows/skills.yml`.
