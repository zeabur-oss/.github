name: Skills

# Copies each skill in .claude/skills that zeabur-oss/skills also has again from zeabur-oss/skills,
# and opens one pull request with what changed. zeabur-oss-bot opens it, because a pull request
# made with GITHUB_TOKEN does not start CI.
on:
  workflow_call:
    secrets:
      private-key:
        description: The private key of zeabur-oss-bot (ZEABUR_OSS_BOT_PRIVATE_KEY).
        required: true

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: copy
        run: |
          source="$RUNNER_TEMP/skills"
          git clone --quiet --depth 1 https://github.com/zeabur-oss/skills.git "$source"
          for dir in .claude/skills/*/; do
            name=$(basename "$dir")
            [[ -d "$source/skills/$name" ]] || continue
            rm -rf "$dir"
            cp -R "$source/skills/$name" "$dir"
          done
          echo "sha=$(git -C "$source" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # The commit's author must match its sign-off (the DCO check).
      - id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "identity=${APP_SLUG}[bot] <${id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          signoff: true
          sign-commits: true
          add-paths: .claude/skills
          branch: update/skills
          delete-branch: true
          commit-message: "chore(skills): update the shared skills"
          title: "chore(skills): update the shared skills"
          body: Copied again from zeabur-oss/skills@${{ steps.copy.outputs.sha }}.
