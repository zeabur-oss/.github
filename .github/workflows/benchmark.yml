name: Benchmark

# Run by hand: runs the CI jobs that can run on Instabox on each runner in `runners`, `repetitions`
# times, and writes the wait and run time of each job and runner to the run's summary
# (scripts/benchmark-report.sh). Run it on main.
# A CI job's size follows the median run time against the GitHub runner's: small if small is
# shorter, else medium if medium is shorter, else medium, or large only when medium is much slower.
on:
  workflow_dispatch:
    inputs:
      runners:
        description: JSON array of runner labels
        default: '["ubuntu-26.04-arm", "instabox-small", "instabox-medium", "instabox-large"]'
      repetitions:
        description: Runs of each job on each runner
        default: "3"

permissions:
  contents: read

jobs:
  repetitions:
    runs-on: ubuntu-slim
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          N: ${{ inputs.repetitions }}
        run: echo "list=$(jq -cn --argjson n "$N" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  lint:
    needs: repetitions
    name: lint ${{ matrix.runner }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(needs.repetitions.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix develop -c scripts/ci/lint.sh
      - run: nix run nixpkgs#zizmor -- --offline --no-progress --min-severity medium .github actions
      - run: jq -e . default.json k3s.json >/dev/null

  skills:
    needs: repetitions
    name: skills ${{ matrix.runner }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(needs.repetitions.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix develop -c scripts/ci/skills.sh

  prose:
    needs: repetitions
    name: prose ${{ matrix.runner }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(needs.repetitions.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix develop -c scripts/ci/prose.sh

  report:
    if: always()
    needs: [lint, skills, prose]
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/benchmark-report.sh
