name: Update

# Moves every pin of zeabur-oss/.github in the caller to the newest commit of its main, copies the
# shared skills again from that commit, and opens one pull request as zeabur-oss-bot
# (actions/bot-pr). The pins come first: the flake input in flake.lock, each `uses:` under .github
# and @zeabur-oss/release in package.json and bun.lock. The flake input is updated first and its
# locked revision is the commit for the rest. The skills are each skill in .claude/skills that
# skills/ here also has.
on:
  workflow_call:
    secrets:
      private-key:
        description: The private key of zeabur-oss-bot (ZEABUR_OSS_BOT_PRIVATE_KEY).
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - id: pin
        run: |
          input=""
          if [[ -f flake.lock ]]; then
            input=$(jq -r '.nodes as $n | $n.root.inputs | to_entries[]
              | select((.value | type) == "string")
              | select($n[.value].original.owner == "zeabur-oss" and $n[.value].original.repo == ".github")
              | .key' flake.lock)
          fi
          if [[ -n "$input" ]]; then
            nix flake update "$input"
            sha=$(jq -r --arg node "$(jq -r --arg i "$input" '.nodes.root.inputs[$i]' flake.lock)" '.nodes[$node].locked.rev' flake.lock)
          else
            sha=$(git ls-remote https://github.com/zeabur-oss/.github refs/heads/main | cut -f1)
          fi
          grep -rlE 'zeabur-oss/\.github/[^@[:space:]]+@[0-9a-f]{40}' .github \
            | xargs -r sed -i -E "s#(zeabur-oss/\.github/[^@[:space:]]+)@[0-9a-f]{40}#\1@${sha}#g"
          if [[ -f package.json ]] && grep -qE 'github:zeabur-oss/\.github#[0-9a-f]{40}' package.json; then
            sed -i -E "s#github:zeabur-oss/\.github\#[0-9a-f]{40}#github:zeabur-oss/.github\#${sha}#" package.json
            nix develop --command bun install
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          source="$RUNNER_TEMP/oss"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth 1 https://github.com/zeabur-oss/.github.git "$SHA"
          git -C "$source" checkout --quiet FETCH_HEAD
          for dir in .claude/skills/*/; do
            name=$(basename "$dir")
            [[ -d "$source/skills/$name" ]] || continue
            rm -rf "$dir"
            cp -R "$source/skills/$name" "$dir"
          done
      - uses: zeabur-oss/.github/actions/bot-pr@1e30fc7b457256c477278e2869e2a86a151fb0b0 # main
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.private-key }}
          workflows: "true"
          branch: update/zeabur-oss
          title: "chore(deps): update zeabur-oss/.github and the shared skills"
          body: |
            Moves every pin of zeabur-oss/.github to zeabur-oss/.github@${{ steps.pin.outputs.sha }} and copies the shared skills again from that commit.
