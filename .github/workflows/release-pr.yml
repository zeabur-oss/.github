name: Release pull request

# Run by hand: knope turns the change files in .changeset/ into the next CHANGELOG.md section and
# version (knope.toml's prepare-release workflow, which may run the caller's own steps), and
# zeabur-oss-bot opens `chore(release): vX.Y.Z` from release/next into main. One release pull request at a time: merge
# or close it before preparing another. With a pre-release label, knope writes vX.Y.Z-<label>.N
# with every change since the last normal release and keeps the change files for it. Once that pull
# request is merged, zeabur-oss-bot tags the commit, which starts the caller's release; a tag pushed
# with GITHUB_TOKEN would start no workflow. The caller's release creates the draft release with its
# files, so a draft is never published without them.
on:
  workflow_call:
    inputs:
      version:
        description: The version to release instead of the one the change files give (v0.2.0); empty for theirs.
        type: string
        default: ""
      prerelease:
        description: The pre-release label (rc, beta) for vX.Y.Z-<label>.N; empty for a normal release.
        type: string
        default: ""
      runner:
        description: The runner of the jobs, which run in the caller's dev shell.
        type: string
        default: instabox-small
    secrets:
      private-key:
        description: The private key of zeabur-oss-bot (ZEABUR_OSS_BOT_PRIVATE_KEY).
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@93292d87f44b07cabee783cb213e4e6c9a46b965 # main
      - name: Install the packages
        run: nix develop --command bun install --frozen-lockfile
      - id: knope
        name: Prepare the release with knope
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag=$(nix develop --command bun x zeabur-oss-release prepare-release --version="$VERSION" --prerelease="$PRERELEASE")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: notes
        name: Write the pull request body
        env:
          TAG: ${{ steps.knope.outputs.tag }}
        run: |
          {
            echo 'body<<EOF'
            echo "Merging this tags the merge commit $TAG, which starts the release. Edit CHANGELOG.md on this branch first if the section should read differently."
            echo
            nix develop --command bun x zeabur-oss-release notes CHANGELOG.md "$TAG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: zeabur-oss/.github/actions/bot-pr@bc2fba94d807c947f554f3b75be5623d86473067 # main
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.private-key }}
          branch: release/next
          title: "chore(release): ${{ steps.knope.outputs.tag }}"
          body: ${{ steps.notes.outputs.body }}

  tag:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(join(github.event.commits.*.message, ' '), 'chore(release): v')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@93292d87f44b07cabee783cb213e4e6c9a46b965 # main
      - name: Install the packages
        run: nix develop --command bun install --frozen-lockfile
      - id: release
        name: Find the release commit in the push
        run: |
          jq -r '.commits[] | [.id, (.message | split("\n")[0])] | @tsv' "$GITHUB_EVENT_PATH" |
            while IFS=$'\t' read -r sha subject; do
              tag=$(nix develop --command bun x zeabur-oss-release release-of "$subject")
              if [ -n "$tag" ]; then
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
                echo "sha=$sha" >> "$GITHUB_OUTPUT"
              fi
            done
      - id: app
        if: steps.release.outputs.tag != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Tag the release commit
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" --silent
