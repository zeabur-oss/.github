name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - run: nix shell nixpkgs#actionlint nixpkgs#shellcheck --command actionlint
      - run: nix run nixpkgs#zizmor -- --offline --no-progress --min-severity medium .github actions
      - run: jq -e . default.json >/dev/null

  release-cli:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - run: nix develop --command bun install --frozen-lockfile
      - name: Formatted
        run: nix develop --command bun fmt --check .
      - name: Type checked
        run: nix develop --command bun check release/ checks/
      - name: Tests, against a registry in memory with images docker saves
        run: nix develop --command bun test release/

  dco:
    uses: ./.github/workflows/dco.yml
