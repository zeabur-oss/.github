name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: instabox-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/ci-setup
      - run: nix develop -c scripts/ci/lint.sh
      - run: jq -e . default.json k3s.json >/dev/null

  release-cli:
    runs-on: instabox-small
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/ci-setup
      - run: nix develop --command bun install --frozen-lockfile
      - name: Formatted
        run: nix develop --command bun fmt --check .
      - name: Type checked
        run: nix develop --command bun check release/ checks/
      - name: Tests, against a registry in memory with images docker saves
        run: nix develop --command bun test release/
