name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# lint, skills and prose take their runner from the variable CI_RUNNER_LINT, such as instabox-small;
# without it they run on GitHub's runner. release-cli builds images with Docker and stays there.
jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER_LINT || 'ubuntu-26.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix develop -c scripts/ci/lint.sh
      - run: nix run nixpkgs#zizmor -- --offline --no-progress --min-severity medium .github actions
      - run: jq -e . default.json k3s.json >/dev/null

  release-cli:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix develop --command bun install --frozen-lockfile
      - name: Formatted
        run: nix develop --command bun fmt --check .
      - name: Type checked
        run: nix develop --command bun check release/ checks/
      - name: Tests, against a registry in memory with images docker saves
        run: nix develop --command bun test release/

  skills:
    runs-on: ${{ vars.CI_RUNNER_LINT || 'ubuntu-26.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix develop -c scripts/ci/skills.sh

  prose:
    runs-on: ${{ vars.CI_RUNNER_LINT || 'ubuntu-26.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix develop -c scripts/ci/prose.sh

  dco:
    uses: ./.github/workflows/dco.yml
