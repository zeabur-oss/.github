name: Release

# A tag vX.Y.Z on a commit of main whose CI passed there (ci-workflows) builds every platform,
# smokes what it built, publishes by digest, signs and attests, then leaves a draft release that a
# maintainer checks and publishes; this workflow never publishes it. CI never runs in the release's
# own run: a test's dependencies cannot reach the candidates, and no job here restores a cache. Run by hand (workflow_dispatch in the caller), it rehearses: the builds and their
# smoke tests, nothing published. With verify-only it checks an existing draft again, with the
# scripts of the commit the run was started from.
#
# Each stage is `scripts/release.sh <stage> ...` in the caller's repository, in its Nix dev shell:
#   check   <version>                                     the version is the manifests' and has a
#                                                         CHANGELOG section
#   build   <version> <os> <arch> <dist>                  build and smoke one platform into <dist>
#   publish <version> <artifacts> <published>             push by digest and sign; write
#                                                         <published>/subjects.json:
#                                                         [{"name": ..., "digest": "sha256:..."}]
#   finish  <version> <os> <arch> <artifacts> <dist>      (finish: true) per finish platform, what
#                                                         needs the published digests, such as an
#                                                         installer
#   assets  <version> <artifacts> <release>               <release>/assets/* with SHA256SUMS, and
#                                                         <release>/notes.md
#   verify  <version> <os> <arch> <downloaded>            check the draft's assets and signatures
# <artifacts> holds one directory per earlier artifact: candidate-<os>-<arch>, published and
# finish-<os>-<arch>. The signatures' identity is this workflow, not the caller's: verify gets it
# in RELEASE_CERT_IDENTITY_REGEXP, RELEASE_SIGNER_WORKFLOW, RELEASE_SOURCE_REPOSITORY and
# RELEASE_SOURCE_REF. build may leave logs in $CI_ARTIFACTS; they are uploaded when it fails.
on:
  workflow_call:
    inputs:
      name:
        description: The product, the release's title before the version (Zeabur Builder).
        type: string
        required: true
      version:
        description: The version to rehearse or verify (v0.1.1); empty for the pushed tag.
        type: string
        default: ''
      verify-only:
        description: Verify the existing draft of this version; build and publish nothing.
        type: boolean
        default: false
      platforms:
        description: JSON array of {os, arch, runner} to build, smoke and finish.
        type: string
        default: >-
          [{"os": "linux", "arch": "amd64", "runner": "ubuntu-26.04"},
           {"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"}]
      verify-platforms:
        description: JSON array of {os, arch, runner} to verify on; empty for the platforms.
        type: string
        default: ''
      finish:
        description: Run the finish stage after publishing.
        type: boolean
        default: false
      finish-platforms:
        description: JSON array of {os, arch, runner} to finish on; empty for the platforms.
        type: string
        default: ''
      ci-workflows:
        description: >-
          Workflow files, space-separated, whose latest run on main for the tagged commit must have
          succeeded. The caller grants actions: read for it.
        type: string
        default: ci.yml
      runner:
        description: The runner of the jobs that are not per platform.
        type: string
        default: ubuntu-26.04-arm

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      actions: read # the CI runs on main
    outputs:
      version: ${{ steps.version.outputs.version }}
      verify-platforms: ${{ steps.version.outputs.verify-platforms }}
      finish-platforms: ${{ steps.version.outputs.finish-platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verify-only && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - id: version
        name: The version is the manifests', with a changelog section, on main
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          VERIFY_ONLY: ${{ inputs.verify-only }}
          PLATFORMS: ${{ inputs.verify-platforms || inputs.platforms }}
          FINISH_PLATFORMS: ${{ inputs.finish-platforms || inputs.platforms }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not vX.Y.Z"; exit 1; }
          ./scripts/release.sh check "$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == push || "$VERIFY_ONLY" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main ||
              { echo "::error::$VERSION is not on main"; exit 1; }
          fi
          {
            echo "version=$VERSION"
            echo "verify-platforms=$(jq -c . <<<"$PLATFORMS")"
            echo "finish-platforms=$(jq -c . <<<"$FINISH_PLATFORMS")"
          } >> "$GITHUB_OUTPUT"
      - name: CI passed on main for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOWS: ${{ inputs.ci-workflows }}
        run: |
          sha=$(git rev-parse HEAD)
          status=0
          for workflow in $CI_WORKFLOWS; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$sha&per_page=100" |
              jq -c --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[]
                | select(.head_repository.full_name == $repo)
                | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")]
                | max_by(.created_at) // empty')
            if [[ -z "$run" ]]; then
              echo "::error::$workflow has no run on main for $sha; run it there first"
              status=1
              continue
            fi
            state=$(jq -r 'if .status != "completed" then "still \(.status)" else .conclusion end' <<<"$run")
            url=$(jq -r .html_url <<<"$run")
            if [[ "$state" == success ]]; then
              echo "$workflow passed on main: $url"
            else
              echo "::error::$workflow on main for $sha: $state ($url)"
              status=1
            fi
          done
          exit $status

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: prepare
    if: ${{ !inputs.verify-only }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Build and smoke
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
        run: ./scripts/release.sh build "$VERSION" "$OS" "$ARCH" dist
      - if: failure() && !env.ACT
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-build-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write # images and charts on ghcr.io
      id-token: write # keyless signatures
    outputs:
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: artifacts
      - id: publish
        name: Publish by digest and sign
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./scripts/release.sh publish "$VERSION" artifacts published
          echo "subjects=$(jq -c . published/subjects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest (${{ matrix.name }})
    needs: publish
    if: needs.publish.outputs.subjects != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.subjects) }}
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}

  finish:
    name: finish (${{ matrix.os }}-${{ matrix.arch }})
    if: inputs.finish && github.event_name == 'push'
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.finish-platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/release.sh finish "$VERSION" "$OS" "$ARCH" artifacts dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finish-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.attest.result != 'failure' &&
          (needs.finish.result == 'success' || needs.finish.result == 'skipped') }}
    needs: [prepare, publish, attest, finish]
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Make the release assets and their checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./scripts/release.sh assets "$VERSION" artifacts release
          test -s release/assets/SHA256SUMS
          test -s release/notes.md
      - name: Attest the release assets' provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/assets/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NAME: ${{ inputs.name }}
        run: |
          prerelease=()
          [[ "$VERSION" != v0.* ]] || prerelease=(--prerelease)
          gh release create "$VERSION" release/assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$GITHUB_SHA" --draft "${prerelease[@]}" \
            --title "$NAME $VERSION" --notes-file release/notes.md

  verify:
    name: verify (${{ matrix.os }}-${{ matrix.arch }})
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.release.result == 'success' || inputs.verify-only) }}
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.verify-platforms) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      # The tag's checkout gives the dev shell the release was built with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verify-only && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false
      # verify-only: the commit this run was started from, which may fix the check.
      - if: inputs.verify-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: verification
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Download the draft's assets and verify them
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          SCRIPTS: ${{ inputs.verify-only && 'verification/scripts' || 'scripts' }}
          RELEASE_CERT_IDENTITY_REGEXP: '^https://github\.com/zeabur-oss/\.github/\.github/workflows/release\.yml@'
          RELEASE_SIGNER_WORKFLOW: zeabur-oss/.github/.github/workflows/release.yml
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_REF: refs/tags/${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded
          "./$SCRIPTS/release.sh" verify "$VERSION" "$OS" "$ARCH" downloaded
