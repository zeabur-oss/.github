name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: build, smoke, publish by digest, sign, attest, leave a draft release.
# A maintainer publishes the draft. Manual run: rehearse without publishing; verify-only re-checks
# a draft. No CI and no cache here: main's required checks already passed.
#
# Stages, each `scripts/release.sh <stage>` in the caller's dev shell:
#   check   <version>                                 the version is the manifests'
#   build   <version> <os> <arch> <dist>              build and smoke one platform
#   sign    <version> <os> <arch> <dist>              with signing-environment, on macOS:
#                                                     Developer ID and notarization
#   publish <version> <artifacts> <published>         push by digest, sign, write subjects.json
#   finish  <version> <os> <arch> <artifacts> <dist>  what needs the digests, such as installers
#   assets  <version> <artifacts> <assets>            copy the release's files into <assets>
#   verify  <version> <os> <arch> <downloaded>        check the images and charts of the draft
# The workflow does the rest with zeabur-oss-release (release/), from the caller's dev shell: the
# CHANGELOG.md section, SHA256SUMS and its signature, the notes, and verifying the assets. verify
# gets the signer from the RELEASE_* env vars; build may leave logs in $CI_ARTIFACTS.
on:
  workflow_call:
    inputs:
      name:
        description: The product, the release's title before the version (Zeabur Builder).
        type: string
        required: true
      docs:
        description: The documentation the notes end with a link to (https://oss.zeabur.com/docs/builder/); empty for none.
        type: string
        default: ''
      version:
        description: The version to rehearse or verify (v0.1.1, v0.1.2-beta.1); empty for the pushed tag.
        type: string
        default: ''
      verify-only:
        description: Verify the existing draft of this version; build and publish nothing.
        type: boolean
        default: false
      platforms:
        description: JSON array of {os, arch, runner} to build, smoke and finish.
        type: string
        default: >-
          [{"os": "linux", "arch": "amd64", "runner": "ubuntu-26.04"},
           {"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"}]
      finish:
        description: Run the finish stage after publishing.
        type: boolean
        default: false
      finish-platforms:
        description: JSON array of {os, arch, runner} to finish on; empty for the platforms.
        type: string
        default: ''
      runner:
        description: The runner of the jobs that are not per platform.
        type: string
        default: ubuntu-26.04-arm
      signing-environment:
        description: >-
          The environment holding the APPLE_* secrets; macOS builds of main and tags run in it
          and are signed and notarized. Empty for none.
        type: string
        default: ''
      telemetry-key:
        description: >-
          A project key that tag builds compile in as ZEABUR_TELEMETRY_KEY, for programs that
          report usage; other builds get none. Empty for none.
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE_P12:
        description: The Developer ID Application certificate with its key, .p12 in base64.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: The .p12's password.
        required: false
      APPLE_API_KEY_P8:
        description: An App Store Connect API key for notarytool, the .p8's text.
        required: false
      APPLE_API_KEY_ID:
        description: That key's ID.
        required: false
      APPLE_API_ISSUER_ID:
        description: That key's issuer ID.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verify-only && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - id: version
        name: The version is the manifests', with a CHANGELOG.md section, on main
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          VERIFY_ONLY: ${{ inputs.verify-only }}
        run: |
          # The manifests take only SemVer; an image tag cannot hold the + of build metadata.
          [[ "$VERSION" == v* && "$VERSION" != *+* ]] ||
            { echo "::error::$VERSION is not v and SemVer without build metadata"; exit 1; }
          ./scripts/release.sh check "$VERSION"
          nix develop --command zeabur-oss-release notes CHANGELOG.md "$VERSION" >/dev/null
          if [[ "$GITHUB_EVENT_NAME" == push || "$VERIFY_ONLY" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main ||
              { echo "::error::$VERSION is not on main"; exit 1; }
          fi
          {
            echo "version=$VERSION"
            echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: prepare
    if: ${{ !inputs.verify-only }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    # The environment's branch rules keep the signing secrets to main and tags; a rehearsal on
    # any other branch builds unsigned.
    environment: >-
      ${{ matrix.os == 'darwin' && (github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')) && inputs.signing-environment || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Build and smoke
        env:
          ZEABUR_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.telemetry-key || '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
        run: ./scripts/release.sh build "$VERSION" "$OS" "$ARCH" dist
      # A step of its own, so the build never sees the secrets. Without them sign leaves the
      # build as it is.
      - name: Sign and notarize
        if: matrix.os == 'darwin' && inputs.signing-environment != ''
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/release.sh sign "$VERSION" "$OS" "$ARCH" dist
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-build-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write # images and charts on ghcr.io
      id-token: write # keyless signatures
    outputs:
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: artifacts
      - id: publish
        name: Publish by digest and sign
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./scripts/release.sh publish "$VERSION" artifacts published
          echo "subjects=$(jq -c . published/subjects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest (${{ matrix.name }})
    needs: publish
    if: needs.publish.outputs.subjects != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.subjects) }}
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}

  finish:
    name: finish (${{ matrix.os }}-${{ matrix.arch }})
    if: inputs.finish && github.event_name == 'push'
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.finish-platforms || inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - env:
          ZEABUR_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.telemetry-key || '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/release.sh finish "$VERSION" "$OS" "$ARCH" artifacts dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finish-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.attest.result != 'failure' &&
          (needs.finish.result == 'success' || needs.finish.result == 'skipped') }}
    needs: [prepare, publish, attest, finish]
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Make the release assets, their signed checksums and the notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DOCS: ${{ inputs.docs }}
        run: |
          mkdir -p release/assets
          ./scripts/release.sh assets "$VERSION" artifacts release/assets
          nix develop --command zeabur-oss-release checksums release/assets
          docs=()
          [[ -z "$DOCS" ]] || docs=("$DOCS")
          nix develop --command zeabur-oss-release notes CHANGELOG.md "$VERSION" "${docs[@]}" >release/notes.md
      - name: Attest the release assets' provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/assets/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          NAME: ${{ inputs.name }}
        run: |
          # GitHub never marks a pre-release latest.
          prerelease=()
          [[ "$PRERELEASE" != true ]] || prerelease=(--prerelease)
          gh release create "$VERSION" release/assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$GITHUB_SHA" --draft "${prerelease[@]}" \
            --title "$NAME $VERSION" --notes-file release/notes.md

  verify:
    name: verify (${{ matrix.os }}-${{ matrix.arch }})
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.release.result == 'success' || inputs.verify-only) }}
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      # The tag's checkout gives the dev shell the release was built with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verify-only && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false
      # verify-only: the commit this run was started from, which may fix the check.
      - if: inputs.verify-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: verification
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Download the draft's assets and verify them
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          SCRIPTS: ${{ inputs.verify-only && 'verification/scripts' || 'scripts' }}
          RELEASE_CERT_IDENTITY_REGEXP: '^https://github\.com/zeabur-oss/\.github/\.github/workflows/release\.yml@'
          RELEASE_SIGNER_WORKFLOW: zeabur-oss/.github/.github/workflows/release.yml
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_REF: refs/tags/${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded
          nix develop --command zeabur-oss-release verify-assets downloaded
          "./$SCRIPTS/release.sh" verify "$VERSION" "$OS" "$ARCH" downloaded
