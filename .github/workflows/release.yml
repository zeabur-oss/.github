name: Release

# The second half of a release, called by a repository's Release workflow after release-build.yml,
# on a pushed tag only: publish by digest, sign, attest, add the assets to the draft release that
# the Release pull request workflow left when it tagged, with its title and notes, and verify the
# draft. A maintainer publishes the draft. No CI and no cache here: the branch's required checks
# already passed.
#
# Stages, each `bun scripts/release.ts <stage>` in the caller's dev shell, after `bun install`
# (the caller's package.json pins @zeabur-oss/release, from release/ here):
#   publish <version> <artifacts> <published>         push by digest, sign, write subjects.json
#   finish  <version> <os> <arch> <artifacts> <dist>  what needs the digests, such as installers
#   assets  <version> <artifacts> <assets>            copy the release's files into <assets>
#   verify  <version> <os> <arch> <downloaded>        check the images and charts of the draft
# The workflow does the rest with the package's zeabur-oss-release command: SHA256SUMS and its
# signature, and verifying the assets. verify gets the signer from the RELEASE_* env vars.
on:
  workflow_call:
    inputs:
      version:
        description: The version release-build.yml built (its version output).
        type: string
        required: true
      platforms:
        description: The platforms release-build.yml built (its platforms output), also the platforms a draft is verified on.
        type: string
        required: true
      finish:
        description: Run the finish stage after publishing.
        type: boolean
        default: false
      finish-platforms:
        description: JSON array of {os, arch, runner} to finish on; empty for the platforms.
        type: string
        default: ""
      runner:
        description: The runner of the jobs that are not per platform.
        type: string
        default: ubuntu-26.04-arm
      telemetry-key:
        description: >-
          A project key that tag builds compile in as ZEABUR_TELEMETRY_KEY, for programs that
          report usage; other builds get none. Empty for none.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # images and charts on ghcr.io
      id-token: write # keyless signatures
    outputs:
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@93292d87f44b07cabee783cb213e4e6c9a46b965 # main
      - name: Install the packages
        run: nix develop --command bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: artifacts
      - id: publish
        name: Publish by digest and sign
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          nix develop --command bun scripts/release.ts publish "$VERSION" artifacts published
          echo "subjects=$(jq -c . published/subjects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest (${{ matrix.name }}@${{ matrix.digest }})
    needs: publish
    if: needs.publish.outputs.subjects != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.subjects) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}

  finish:
    name: finish (${{ matrix.os }}-${{ matrix.arch }})
    if: inputs.finish
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.finish-platforms || inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@93292d87f44b07cabee783cb213e4e6c9a46b965 # main
      - name: Install the packages
        run: nix develop --command bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Finish the build with the published artifacts
        env:
          ZEABUR_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.telemetry-key || '' }}
          VERSION: ${{ inputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: nix develop --command bun scripts/release.ts finish "$VERSION" "$OS" "$ARCH" artifacts dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finish-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.attest.result != 'failure' &&
          (needs.finish.result == 'success' || needs.finish.result == 'skipped') }}
    needs: [publish, attest, finish]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Install the packages
        run: nix develop --command bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Make the release assets and their signed checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release/assets
          nix develop --command bun scripts/release.ts assets "$VERSION" artifacts release/assets
          nix develop --command bun x zeabur-oss-release checksums release/assets
      - name: Attest the release assets' provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/assets/SHA256SUMS
      - name: Add the assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "$VERSION" release/assets/* --repo "$GITHUB_REPOSITORY" --clobber

  verify:
    name: verify (${{ matrix.os }}-${{ matrix.arch }})
    # A skipped finish would skip this too without the explicit condition.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@93292d87f44b07cabee783cb213e4e6c9a46b965 # main
      - name: Install the packages
        run: nix develop --command bun install --frozen-lockfile
      - name: Download the draft's assets and verify them
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          RELEASE_CERT_IDENTITY_REGEXP: '^https://github\.com/zeabur-oss/\.github/\.github/workflows/release\.yml@'
          RELEASE_SIGNER_WORKFLOW: zeabur-oss/.github/.github/workflows/release.yml
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_REF: refs/tags/${{ inputs.version }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded
          nix develop --command bun x zeabur-oss-release verify-assets downloaded
          nix develop --command bun scripts/release.ts verify "$VERSION" "$OS" "$ARCH" downloaded
