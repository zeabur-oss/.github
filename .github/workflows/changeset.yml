name: Changeset

# A pull request whose title is feat, fix or perf, or marks a breaking change with !, adds a
# change file in .changeset/ for the changelog, or carries the label `changelog: none`. The level
# in the file is the change's effect on users, which the reviewer checks; it is not derived from
# the title. Every change file the pull request adds is checked for knope's format and packages.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  changeset:
    name: changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          NONE: "${{ contains(github.event.pull_request.labels.*.name, 'changelog: none') }}"
        run: |
          status=0
          # knope.toml's packages: `default` for a single [package], else each [packages.<name>].
          if grep -q '^\[package\]' knope.toml; then
            packages=default
          else
            packages=$(sed -nE 's/^\[packages\.("?)([^]"]+)\1\]$/\2/p' knope.toml | tr '\n' ' ')
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- '.changeset/*.md')
          for file in "${files[@]}"; do
            # Front matter of `<package>: major|minor|patch` lines, then a `# ` summary. knope skips
            # a file it cannot read, or a package it does not know, without an error.
            if ! awk -v packages="$packages" '
              BEGIN { n = split(packages, list, " "); for (i = 1; i <= n; i++) known[list[i]] = 1 }
              NR == 1 { if ($0 != "---") exit 1; next }
              !done && $0 == "---" { done = 1; next }
              !done {
                if ($0 !~ /^("[^"]+"|[^": ]+): (major|minor|patch)$/) exit 1
                name = substr($0, 1, index($0, ": ") - 1); gsub(/^"|"$/, "", name)
                if (!(name in known)) exit 1
                levels++; next
              }
              /^# [^ ]/ { summary = 1 }
              END { exit !(done && levels && summary) }
            ' "$file"; then
              echo "::error file=$file::a change file starts with --- lines of '<package>: major|minor|patch' for a package in knope.toml ($packages), then '# <summary>'"
              status=1
            fi
          done
          if [[ "$TITLE" =~ ^(feat|fix|perf)(\(|!|:) || "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            if [[ ${#files[@]} -eq 0 && "$NONE" != true ]]; then
              echo "::error::'$TITLE' needs a change file in .changeset/ (knope document-change), or the label 'changelog: none' when users see no difference"
              status=1
            fi
          fi
          exit $status
